  <style>
    :root {
      --verde-hcpa: #276e5b;
      --amarelo-hcpa: #ffe900;
      --preto: #000;
      --cinza: #333;
      --cinza-claro: #f5f5f5;
      --azul: #0074d9;
      --vermelho: #d70000;
      --verde-claro: #4CAF50;
      --laranja: #ff9800;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }

    /* LOGIN */
    .login-container {
      background: linear-gradient(135deg, var(--verde-hcpa) 0%, #1f5a48 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-form {
      background: var(--preto);
      border-radius: 20px;
      padding: 50px;
      box-shadow: 0 10px 40px #0009;
      text-align: center;
      min-width: 350px;
      border: 3px solid var(--amarelo-hcpa);
    }

    .login-form .titulo {
      font-size: 2.2em;
      color: var(--amarelo-hcpa);
      margin-bottom: 10px;
      font-weight: bold;
      text-shadow: 0 2px 4px #000;
    }

    .login-form label {
      display: block;
      color: var(--amarelo-hcpa);
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 5px;
      text-align: left;
      font-size: 1.1em;
    }

    .login-form input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--amarelo-hcpa);
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 1em;
      box-sizing: border-box;
      background: #222;
      color: var(--amarelo-hcpa);
    }

    .login-form button {
      background: linear-gradient(135deg, var(--amarelo-hcpa) 0%, #ffd700 100%);
      color: var(--preto);
      border: none;
      border-radius: 8px;
      padding: 12px 30px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s;
      text-transform: uppercase;
    }

    .login-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px #ffe90055;
    }

    .login-form .msg {
      color: #ff6b6b;
      margin-top: 15px;
      font-weight: bold;
    }

    /* PAINEL */
    .painel-container {
      display: none;
      padding: 20px;
      max-width: 1800px;
      margin: 0 auto;
    }

    .header-painel {
      background: linear-gradient(135deg, var(--verde-hcpa) 0%, #1f5a48 100%);
      color: var(--amarelo-hcpa);
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 5px 20px #0002;
      border: 2px solid var(--amarelo-hcpa);
    }

    .header-painel .titulo {
      font-size: 2em;
      font-weight: bold;
    }

    .header-actions {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .export-btn, .logout-btn {
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      text-transform: uppercase;
      font-size: 0.9em;
    }

    .export-btn {
      background: var(--verde-claro);
      color: #fff;
    }

    .export-btn:hover {
      background: #3d8b40;
      transform: scale(1.05);
    }

    .logout-btn {
      background: #d70000;
      color: #fff;
    }

    .logout-btn:hover {
      background: #a00000;
    }

    /* ABAS */
    .abas-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .aba-btn {
      background: #333;
      color: #aaa;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      text-transform: uppercase;
      font-size: 0.9em;
    }

    .aba-btn.active {
      background: linear-gradient(135deg, var(--verde-hcpa) 0%, #1f5a48 100%);
      color: var(--amarelo-hcpa);
      box-shadow: 0 5px 15px #0002;
    }

    .aba-conteudo {
      display: none;
    }

    .aba-conteudo.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* FILTROS */
    .filtro-box {
      background: #222;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filtro-box label {
      font-weight: bold;
      color: var(--amarelo-hcpa);
    }

    .filtro-box select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--amarelo-hcpa);
      background: #1a1a1a;
      color: var(--amarelo-hcpa);
      font-size: 1em;
      cursor: pointer;
    }

    /* GRÁFICO SEGMENTADO */
    .grafico-segmentado {
      background: #1a1a1a;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 5px 20px #0002;
      border: 2px solid var(--verde-hcpa);
      margin-bottom: 20px;
    }

    .grafico-titulo {
      font-weight: bold;
      color: var(--amarelo-hcpa);
      margin-bottom: 20px;
      font-size: 1.3em;
      text-align: center;
    }

    .barras-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .barra-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .barra-valor {
      font-size: 1.3em;
      font-weight: bold;
      color: var(--amarelo-hcpa);
      text-align: center;
    }

    .barra-segmentada {
      width: 60px;
      min-height: 250px;
      border-radius: 8px;
      display: flex;
      flex-direction: column-reverse;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);

      overflow: hidden;

    .segmento {

    }

    .tooltip-segmento {
      position: absolute;
      background: rgba(0, 0, 0, 0.95);
      color: var(--amarelo-hcpa);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9em;
      font-weight: bold;
      white-space: nowrap;
      pointer-events: none;
      z-index: 100;
      display: none;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-bottom: 8px;
      border: 1px solid var(--amarelo-hcpa);
    }

    .segmento:hover .tooltip-segmento {
      display: block;
    }

    .barra-label {
      font-size: 1em;
      font-weight: bold;
      color: var(--amarelo-hcpa);
      text-align: center;
      max-width: 80px;
      word-break: break-word;
    }

    .legenda-graficos {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      padding-top: 16px;
      border-top: 1px solid #ffe90033;
      margin-top: 16px;
    }

    .legenda-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1em;
      color: var(--amarelo-hcpa);
    }

    .legenda-cor {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }

    /* TABELA */
    .tabela-usuarios-container {
      background: #1a1a1a;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 20px #0002;
      border: 2px solid var(--verde-hcpa);
      margin-bottom: 20px;
    }

    .tabela-titulo {
      background: linear-gradient(135deg, var(--verde-hcpa) 0%, #1f5a48 100%);
      color: var(--amarelo-hcpa);
      padding: 20px;
      font-weight: bold;
      font-size: 1.1em;
      border-bottom: 2px solid var(--amarelo-hcpa);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1em;
    }

    table thead {
      background: #0a0a0a;
    }

    table th {
      color: var(--amarelo-hcpa);
      padding: 15px;
      text-align: left;
      font-weight: bold;
      border-bottom: 2px solid var(--amarelo-hcpa);
    }

    table tbody tr {
      border-bottom: 1px solid #333;
      transition: all 0.3s;
    }

    table tbody tr:hover {
      background: #2a2a2a;
      transform: scale(1.01);
    }

    table td {
      padding: 15px;
      color: var(--amarelo-hcpa);
    }

    .numero {
      color: #4CAF50;
      font-weight: bold;
    }

    .msg-vazio {
      text-align: center;
      padding: 40px 20px;
      color: #666;
      font-size: 1.1em;
    }

    @media (max-width: 768px) {
      .header-painel {
        flex-direction: column;
        gap: 15px;
      }
      .barras-container {
        grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
      }
    }
  </style>

<body>
  <!-- LOGIN -->
  <div id="loginContainer" class="login-container">
    <div class="login-form">
      <div class="titulo">📊 PAINEL DE CHEFIA</div>
      <label for="usuarioLogin">👤 Usuário:</label>
      <input type="text" id="usuarioLogin" autofocus>
      <label for="senhaLogin">🔐 Senha:</label>
      <input type="password" id="senhaLogin">
      <button onclick="fazerLogin()">🔓 ENTRAR</button>
      <div id="msgLogin" class="msg"></div>
    </div>
  </div>

  <!-- PAINEL -->
  <div id="painelContainer" class="painel-container">
    <div class="header-painel">
      <div>
        <div class="titulo">📊 Painel de Chefia - Radiologia HCPA</div>
        <div id="usuarioAtual" style="font-size: 0.9em; margin-top: 5px;">Usuário: --</div>
      </div>
      <div class="header-actions">
        <button class="logout-btn" onclick="fazerLogout()">🚪 Sair</button>
      </div>
    </div>

    <!-- ABAS -->
    <div class="abas-container">
      <button class="aba-btn active" onclick="mudarAba('resumo')">📊 Resumo do Dia</button>
      <button class="aba-btn" onclick="mudarAba('semanal')">📈 Histórico Semanal</button>
      <button class="aba-btn" onclick="mudarAba('mensal')">📅 Histórico Mensal</button>
    </div>

    <!-- ABA 1: RESUMO DO DIA -->
    <div id="abaResumo" class="aba-conteudo active">
      <div class="tabela-usuarios-container">
        <div class="tabela-titulo">👥 Atendentes - Resumo do Dia</div>
        <table>
          <thead>
            <tr>
              <th>Usuário</th>
              <th class="numero">Qt Agendar</th>
              <th class="numero">Qt Agendados</th>
              <th class="numero">Qt Preferencial</th>
              <th class="numero">Total</th>
            </tr>
          </thead>
          <tbody id="tabelaResumo">
            <tr><td colspan="5" class="msg-vazio">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ABA 2: HISTÓRICO SEMANAL -->
    <div id="abaSemanal" class="aba-conteudo">
      <div class="filtro-box">
        <label for="semanaSelect">Escolha a Semana do Mês:</label>
        <select id="semanaSelect" onchange="atualizarGraficoSemanal()">
          <option value="">Carregando...</option>
        </select>
      </div>
      <div id="graficoSemanalArea" class="grafico-segmentado"></div>
    </div>

    <!-- ABA 3: HISTÓRICO MENSAL -->
    <div id="abaMensal" class="aba-conteudo">
      <div class="filtro-box">
        <label for="mesSelect">Escolha o Mês:</label>
        <select id="mesSelect" onchange="atualizarGraficoMensal()">
          <option value="">Carregando...</option>
        </select>
      </div>
      <div id="graficoMensalArea" class="grafico-segmentado"></div>
    </div>
  </div>

  <script>
    const senhaAdmin = "chefia2025";
    const usuariosAutorizados = ["alpinto", "mdsantos"];

    let usuarioLogado = null;
    let atendimentosData = {};

    const firebaseConfig = {
      apiKey: "AIzaSyAsuP9gO2sBOmzBet2b7ijljMgTsXo29lE",
      authDomain: "painel-senhas-hcpa.firebaseapp.com",
      databaseURL: "https://painel-senhas-hcpa-default-rtdb.firebaseio.com",
      projectId: "painel-senhas-hcpa",
      storageBucket: "painel-senhas-hcpa.firebasestorage.app",
      messagingSenderId: "164117661743",
      appId: "1:164117661743:web:c82a42d485af05ecd71eda",
      measurementId: "G-92XCSNDE54"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function fazerLogin() {
      const usuario = document.getElementById("usuarioLogin").value.trim().toLowerCase();
      const senha = document.getElementById("senhaLogin").value;
      const msg = document.getElementById("msgLogin");

      if (usuariosAutorizados.includes(usuario) && senha === senhaAdmin) {
        usuarioLogado = usuario;
        document.getElementById("loginContainer").style.display = "none";
        document.getElementById("painelContainer").style.display = "block";
        document.getElementById("usuarioAtual").textContent = `👤 Usuário: ${usuarioLogado}`;
        msg.textContent = "";
        carregarDados();
        return;
      }

      msg.textContent = "❌ Usuário ou senha incorretos!";
    }

    function fazerLogout() {
      usuarioLogado = null;
      document.getElementById("loginContainer").style.display = "flex";
      document.getElementById("painelContainer").style.display = "none";
      document.getElementById("usuarioLogin").value = "";
      document.getElementById("senhaLogin").value = "";
    }

    function carregarDados() {
      db.ref("atendimentos").on("value", snap => {
        atendimentosData = snap.val() || {};
        atualizarResumo();
        preencherSelectSemanas();
        preencherSelectMeses();
      });
    }

    function mudarAba(aba) {
      document.querySelectorAll(".aba-conteudo").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".aba-btn").forEach(el => el.classList.remove("active"));

      document.getElementById(`aba${aba.charAt(0).toUpperCase()}${aba.slice(1)}`).classList.add("active");
      event.target.classList.add("active");

      if (aba === "semanal") {
        setTimeout(() => atualizarGraficoSemanal(), 100);
      } else if (aba === "mensal") {
        setTimeout(() => atualizarGraficoMensal(), 100);
      }
    }

    function atualizarResumo() {
      const agora = new Date();
      const hojeStr = agora.toISOString().slice(0, 10);
      const tbody = document.getElementById("tabelaResumo");
      tbody.innerHTML = "";

      const usuariosStats = {};

      for (let usuario in atendimentosData) {
        const atendimentos = Object.values(atendimentosData[usuario]).filter(a => a && typeof a === 'object');
        const hoje = atendimentos.filter(a => new Date(a.timestamp).toISOString().slice(0, 10) === hojeStr);

        if (hoje.length === 0) continue;

        const contadores = { agendar: 0, agendados: 0, preferencial: 0 };
        hoje.forEach(a => {
          if (a.tipo === "Agendar") contadores.agendar++;
          else if (a.tipo === "Agendados") contadores.agendados++;
          else if (a.tipo === "Preferencial") contadores.preferencial++;
        });

        usuariosStats[usuario] = contadores;
      }

      const usuarios = Object.keys(usuariosStats).sort();

      if (usuarios.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="msg-vazio">Nenhum atendimento hoje</td></tr>';
        return;
      }

      usuarios.forEach(usuario => {
        const stats = usuariosStats[usuario];
        const total = stats.agendar + stats.agendados + stats.preferencial;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${usuario}</td>
          <td class="numero">${stats.agendar}</td>
          <td class="numero">${stats.agendados}</td>
          <td class="numero">${stats.preferencial}</td>
          <td class="numero">${total}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function preencherSelectSemanas() {
      const select = document.getElementById("semanaSelect");
      const agora = new Date();
      const anoAtual = agora.getFullYear();
      const mesAtual = agora.getMonth();

      const opcoes = [];
      for (let m = 0; m < 12; m++) {
        const primeiroDia = new Date(anoAtual, m, 1);
        const ultimoDia = new Date(anoAtual, m + 1, 0);
        let semanaNum = 1;
        let diaAtual = new Date(primeiroDia);

        while (diaAtual <= ultimoDia) {
          const proxima = new Date(diaAtual);
          proxima.setDate(proxima.getDate() + 7);
          const proximaValida = proxima > ultimoDia ? ultimoDia : new Date(proxima.getTime() - 86400000);

          const opcao = `${diaAtual.getDate()}/${String(m + 1).padStart(2, '0')} a ${proximaValida.getDate()}/${String(m + 1).padStart(2, '0')}`;
          opcoes.push({ texto: opcao, valor: `${anoAtual}-${m}-${semanaNum}` });

          diaAtual = new Date(proxima);
          diaAtual.setDate(diaAtual.getDate() + 1);
          semanaNum++;
        }
      }

      select.innerHTML = opcoes.map(o => `<option value="${o.valor}">${o.texto}</option>`).join('');
    }

    function preencherSelectMeses() {
      const select = document.getElementById("mesSelect");
      const agora = new Date();
      const anoAtual = agora.getFullYear();

      const opcoes = [];
      for (let m = 0; m < 12; m++) {
        const nomeM = new Date(anoAtual, m, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
        opcoes.push({ texto: nomeM.charAt(0).toUpperCase() + nomeM.slice(1), valor: `${anoAtual}-${m}` });
      }

      select.innerHTML = opcoes.map(o => `<option value="${o.valor}">${o.texto}</option>`).join('');
      if (select.value === "") {
        select.value = opcoes[agora.getMonth()].valor;
      }
    }

    function atualizarGraficoSemanal() {
      const select = document.getElementById("semanaSelect");
      const valor = select.value;
      if (!valor) return;

      const [ano, mes, semana] = valor.split('-');
      const dadosSemana = obterDadosSemana(parseInt(ano), parseInt(mes), parseInt(semana));

      renderizarGrafico(dadosSemana, "graficoSemanalArea", "Histórico Semanal");
    }

    function atualizarGraficoMensal() {
      const select = document.getElementById("mesSelect");
      const valor = select.value;
      if (!valor) return;

      const [ano, mes] = valor.split('-');
      const dadosMes = obterDadosMes(parseInt(ano), parseInt(mes));

      renderizarGrafico(dadosMes, "graficoMensalArea", "Histórico Mensal");
    }

    function obterDadosSemana(ano, mes, semana) {
      const primeiroDia = new Date(ano, mes, 1);
      const ultimoDia = new Date(ano, mes + 1, 0);

      let diaAtual = new Date(primeiroDia);
      let semanaAtual = 1;
      let diasSemana = [];

      while (diaAtual <= ultimoDia && semanaAtual <= semana) {
        if (semanaAtual === semana) {
          diasSemana.push(new Date(diaAtual));
        }
        diaAtual.setDate(diaAtual.getDate() + 1);
        if (diaAtual.getDate() === 1) semanaAtual++;
      }

      const diaNomes = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sab'];
      const dados = [];

      diasSemana.forEach(dia => {
        const diaStr = dia.toISOString().slice(0, 10);
        const contadores = { agendar: 0, agendados: 0, preferencial: 0 };

        for (let usuario in atendimentosData) {
          const atendimentos = Object.values(atendimentosData[usuario]).filter(a => a && typeof a === 'object');
          atendimentos.forEach(a => {
            if (new Date(a.timestamp).toISOString().slice(0, 10) === diaStr) {
              if (a.tipo === "Agendar") contadores.agendar++;
              else if (a.tipo === "Agendados") contadores.agendados++;
              else if (a.tipo === "Preferencial") contadores.preferencial++;
            }
          });
        }

        dados.push({
          label: `${diaNomes[dia.getDay()]} ${dia.getDate()}`,
          agendar: contadores.agendar,
          agendados: contadores.agendados,
          preferencial: contadores.preferencial
        });
      });

      return dados;
    }

    function obterDadosMes(ano, mes) {
      const ultimoDia = new Date(ano, mes + 1, 0).getDate();
      const dados = [];

      for (let dia = 1; dia <= ultimoDia; dia++) {
        const diaStr = new Date(ano, mes, dia).toISOString().slice(0, 10);
        const contadores = { agendar: 0, agendados: 0, preferencial: 0 };

        for (let usuario in atendimentosData) {
          const atendimentos = Object.values(atendimentosData[usuario]).filter(a => a && typeof a === 'object');
          atendimentos.forEach(a => {
            if (new Date(a.timestamp).toISOString().slice(0, 10) === diaStr) {
              if (a.tipo === "Agendar") contadores.agendar++;
              else if (a.tipo === "Agendados") contadores.agendados++;
              else if (a.tipo === "Preferencial") contadores.preferencial++;
            }
          });
        }

        dados.push({
          label: `${dia}`,
          agendar: contadores.agendar,
          agendados: contadores.agendados,
          preferencial: contadores.preferencial
        });
      }

      return dados;
    }

    function renderizarGrafico(dados, containerId, titulo) {
      const container = document.getElementById(containerId);
      const maxTotal = Math.max(...dados.map(d => d.agendar + d.agendados + d.preferencial), 1);

      let html = `<div class="grafico-titulo">${titulo}</div><div class="barras-container">`;

      dados.forEach(item => {
        const total = item.agendar + item.agendados + item.preferencial;
        const alturaTotal = total > 0 ? 250 : 0;
        const alturaAgendar = total > 0 ? (item.agendar / total) * alturaTotal : 0;
        const alturaAgendados = total > 0 ? (item.agendados / total) * alturaTotal : 0;
        const alturaPreferencial = total > 0 ? (item.preferencial / total) * alturaTotal : 0;

        html += `
          <div class="barra-item">
            <div class="barra-valor">${total}</div>
            <div class="barra-segmentada">
              ${item.agendar > 0 ? `
                <div class="segmento agendar" style="height: ${alturaAgendar}px;">
                  <div class="tooltip-segmento">Agendar: ${item.agendar}</div>
                </div>
              ` : ''}
              ${item.agendados > 0 ? `
                <div class="segmento agendados" style="height: ${alturaAgendados}px;">
                  <div class="tooltip-segmento">Agendados: ${item.agendados}</div>
                </div>
              ` : ''}
              ${item.preferencial > 0 ? `
                <div class="segmento preferencial" style="height: ${alturaPreferencial}px;">
                  <div class="tooltip-segmento">Preferencial: ${item.preferencial}</div>
                </div>
              ` : ''}
            </div>
            <div class="barra-label">${item.label}</div>
          </div>
        `;
      });

      html += `</div><div class="legenda-graficos">
        <div class="legenda-item"><div class="legenda-cor" style="background: #d70000;"></div>Agendar</div>
        <div class="legenda-item"><div class="legenda-cor" style="background: #0074d9;"></div>Agendados</div>
        <div class="legenda-item"><div class="legenda-cor" style="background: var(--amarelo-hcpa);"></div>Preferencial</div>
      </div>`;

      container.innerHTML = html;
    }

    document.getElementById("senhaLogin").addEventListener("keyup", function(e) {
      if (e.key === "Enter") fazerLogin();
    });
  </script>
</body>
</html>
