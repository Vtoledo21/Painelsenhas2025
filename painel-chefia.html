<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Chefia - Atendimentos</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --verde-hcpa: #276e5b;
      --amarelo-hcpa: #ffe900;
      --preto: #000;
      --cinza: #333;
      --cinza-claro: #f5f5f5;
      --azul: #0074d9;
      --vermelho: #d70000;
      --verde-claro: #4CAF50;
      --laranja: #ff9800;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }

    /* LOGIN */
    .login-container {
      background: linear-gradient(135deg, var(--verde-hcpa) 0%, #1f5a48 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-form {
      background: var(--preto);
      border-radius: 20px;
      padding: 50px;
      box-shadow: 0 10px 40px #0009;
      text-align: center;
      min-width: 350px;
      border: 3px solid var(--amarelo-hcpa);
    }

    .login-form .titulo {
      font-size: 2.2em;
      color: var(--amarelo-hcpa);
      margin-bottom: 10px;
      font-weight: bold;
      text-shadow: 0 2px 4px #000;
    }

    .login-form label {
      display: block;
      color: var(--amarelo-hcpa);
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 5px;
      text-align: left;
      font-size: 1.1em;
    }

    .login-form input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--amarelo-hcpa);
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 1em;
      box-sizing: border-box;
      background: #222;
      color: var(--amarelo-hcpa);
    }

    .login-form button {
      background: linear-gradient(135deg, var(--amarelo-hcpa) 0%, #ffd700 100%);
      color: var(--preto);
      border: none;
      border-radius: 8px;
      padding: 12px 30px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s;
      text-transform: uppercase;
    }

    .login-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px #ffe90055;
    }

    .login-form .msg {
      color: #ff6b6b;
      margin-top: 15px;
      font-weight: bold;
    }

    /* PAINEL */
    .painel-container {
      display: none;
      padding: 20px;
      max-width: 1800px;
      margin: 0 auto;
    }

    .header-painel {
      background: linear-gradient(135deg, var(--verde-hcpa) 0%, #1f5a48 100%);
      color: var(--amarelo-hcpa);
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 5px 20px #0002;
      border: 2px solid var(--amarelo-hcpa);
    }

    .header-painel .titulo {
      font-size: 2em;
      font-weight: bold;
    }

    .header-actions {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .export-btn, .logout-btn {
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      text-transform: uppercase;
      font-size: 0.9em;
    }

    .export-btn {
      background: var(--verde-claro);
      color: #fff;
    }

    .export-btn:hover {
      background: #3d8b40;
      transform: scale(1.05);
    }

    .logout-btn {
      background: #d70000;
      color: #fff;
    }

    .logout-btn:hover {
      background: #a00000;
    }

    /* ABAS */
    .abas-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .aba-btn {
      background: #333;
      color: #aaa;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      text-transform: uppercase;
      font-size: 0.9em;
    }

    .aba-btn.active {
      background: linear-gradient(135deg, var(--verde-hcpa) 0%, #1f5a48 100%);
      color: var(--amarelo-hcpa);
      box-shadow: 0 5px 15px #0002;
    }

    .aba-conteudo {
      display: none;
    }

    .aba-conteudo.active {
      display: block;
    }

    /* RESUMO */
    .tabela-resumo {
      background: var(--cinza);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 15px #0002;
      margin-bottom: 20px;
    }

    .tabela-resumo table {
      width: 100%;
      border-collapse: collapse;
    }

    .tabela-resumo th {
      background: var(--verde-hcpa);
      color: var(--amarelo-hcpa);
      padding: 15px;
      text-align: left;
      font-weight: bold;
      border-bottom: 2px solid var(--amarelo-hcpa);
    }

    .tabela-resumo td {
      padding: 12px 15px;
      border-bottom: 1px solid #555;
    }

    .tabela-resumo tr:hover {
      background: #444;
    }

    .tabela-resumo .numero {
      text-align: center;
      font-weight: bold;
    }

    .tabela-resumo .msg-vazio {
      text-align: center;
      color: #aaa;
      padding: 30px;
    }

    /* TEMPO REAL */
    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: linear-gradient(135deg, var(--verde-hcpa) 0%, #1f5a48 100%);
      border-radius: 12px;
      padding: 20px;
      border: 2px solid var(--amarelo-hcpa);
      box-shadow: 0 5px 15px #0002;
    }

    .card .titulo-card {
      font-size: 1.3em;
      color: var(--amarelo-hcpa);
      font-weight: bold;
      margin-bottom: 10px;
    }

    .card .valor {
      font-size: 2.5em;
      color: #fff;
      font-weight: bold;
    }

    .card .subtitulo {
      font-size: 0.9em;
      color: #ddd;
      margin-top: 5px;
    }

    /* GRÁFICOS */
    .graficos-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .grafico-box {
      background: var(--cinza);
      border-radius: 12px;
      padding: 20px;
      border: 2px solid var(--amarelo-hcpa);
      box-shadow: 0 5px 15px #0002;
    }

    .grafico-box .titulo-grafico {
      font-size: 1.2em;
      color: var(--amarelo-hcpa);
      margin-bottom: 15px;
      font-weight: bold;
    }

    .grafico-box canvas {
      max-width: 100%;
    }

    /* FILTROS */
    .filtros-container {
      background: var(--cinza);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 2px solid var(--amarelo-hcpa);
      box-shadow: 0 5px 15px #0002;
    }

    .filtro-item {
      display: inline-block;
      margin-right: 20px;
      margin-bottom: 10px;
    }

    .filtro-item label {
      color: var(--amarelo-hcpa);
      font-weight: bold;
      margin-right: 10px;
    }

    .filtro-item select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 2px solid var(--amarelo-hcpa);
      background: #222;
      color: var(--amarelo-hcpa);
      font-weight: bold;
      cursor: pointer;
    }

    /* HISTÓRICO */
    .historico-semana-container {
      background: var(--cinza);
      border-radius: 12px;
      padding: 20px;
      border: 2px solid var(--amarelo-hcpa);
      margin-bottom: 20px;
      box-shadow: 0 5px 15px #0002;
    }

    .historico-dias {
      display: grid;
      gap: 15px;
    }

    .dia-item {
      background: #222;
      border-radius: 8px;
      padding: 15px;
      border-left: 4px solid var(--amarelo-hcpa);
    }

    .dia-titulo {
      color: var(--amarelo-hcpa);
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 1.1em;
    }

    .barra-horizontal {
      display: flex;
      height: 40px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 10px;
      background: #111;
    }

    .barra-segmento {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      font-size: 0.9em;
      cursor: pointer;
      transition: opacity 0.3s;
      position: relative;
    }

    .barra-segmento:hover {
      opacity: 0.8;
    }

    .barra-segmento.agendar {
      background: var(--vermelho);
    }

    .barra-segmento.agendados {
      background: var(--azul);
    }

    .barra-segmento.preferencial {
      background: var(--amarelo-hcpa);
    }

    .total-dia {
      text-align: right;
      color: var(--amarelo-hcpa);
      font-weight: bold;
      font-size: 1.1em;
    }

    .tooltip {
      position: absolute;
      background: rgba(0,0,0,0.9);
      color: var(--amarelo-hcpa);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8em;
      white-space: nowrap;
      pointer-events: none;
      z-index: 1000;
      border: 1px solid var(--amarelo-hcpa);
    }

    .legenda-historico {
      display: flex;
      gap: 30px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #555;
      flex-wrap: wrap;
    }

    .legenda-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legenda-cor {
      width: 20px;
      height: 20px;
      border-radius: 3px;
    }

    .legenda-cor.agendar {
      background: var(--vermelho);
    }

    .legenda-cor.agendados {
      background: var(--azul);
    }

    .legenda-cor.preferencial {
      background: var(--amarelo-hcpa);
    }

    .legenda-texto {
      color: #ddd;
      font-weight: bold;
    }

    .info-total {
      margin-top: 15px;
      padding: 15px;
      background: #111;
      border-radius: 6px;
      border-left: 4px solid var(--verde-claro);
      color: var(--verde-claro);
      font-weight: bold;
    }

    .mes-header {
      color: var(--amarelo-hcpa);
      font-size: 1.3em;
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 15px;
      padding: 10px;
      background: #222;
      border-radius: 6px;
      border-left: 4px solid var(--amarelo-hcpa);
    }

    .semana-header {
      color: var(--amarelo-hcpa);
      font-size: 1.2em;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 10px;
      padding: 8px;
      background: #222;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div class="login-container" id="login-protect">
    <form class="login-form" onsubmit="checarLogin(); return false;">
      <div class="titulo">🔐 Painel de Chefia</div>
      <label>Usuário:</label>
      <input type="text" id="usuario" placeholder="Digite seu usuário">
      <label>Senha:</label>
      <input type="password" id="senha" placeholder="Digite sua senha">
      <button type="submit">Entrar</button>
      <div class="msg" id="msgSenha"></div>
    </form>
  </div>

  <!-- PAINEL -->
  <div class="painel-container" id="painel-container">
    <div class="header-painel">
      <div class="titulo">📊 Painel de Atendimentos - Chefia</div>
      <div class="header-actions">
        <button class="export-btn" onclick="exportarDados()">📥 Exportar</button>
        <button class="logout-btn" onclick="logout()">🚪 Sair</button>
      </div>
    </div>

    <!-- ABAS -->
    <div class="abas-container">
      <button class="aba-btn active" onclick="mudarAba('resumo')">📋 Resumo</button>
      <button class="aba-btn" onclick="mudarAba('tempo-real')">⚡ Tempo Real</button>
      <button class="aba-btn" onclick="mudarAba('graficos')">📈 Gráficos</button>
      <button class="aba-btn" onclick="mudarAba('historico-semanal')">📅 Histórico Semanal</button>
      <button class="aba-btn" onclick="mudarAba('historico-mensal')">🗓️ Histórico Mensal</button>
    </div>

    <!-- ABA: RESUMO -->
    <div class="aba-conteudo active" id="abaResumo">
      <div class="tabela-resumo">
        <table>
          <thead>
            <tr>
              <th>Usuário</th>
              <th>Manhã</th>
              <th>Tarde</th>
              <th>Total</th>
              <th>Último Atendimento</th>
              <th>Tempo Médio</th>
            </tr>
          </thead>
          <tbody id="tabelaResumo">
            <tr><td colspan="7" class="msg-vazio">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ABA: TEMPO REAL -->
    <div class="aba-conteudo" id="abaTempoReal">
      <div class="cards-container" id="cardsTempoReal">
        <div class="card">
          <div class="titulo-card">Atendimentos Hoje</div>
          <div class="valor" id="qtTotalHoje">0</div>
        </div>
        <div class="card">
          <div class="titulo-card">Manhã</div>
          <div class="valor" id="qtManhaHoje">0</div>
        </div>
        <div class="card">
          <div class="titulo-card">Tarde</div>
          <div class="valor" id="qtTardeHoje">0</div>
        </div>
      </div>
    </div>

    <!-- ABA: GRÁFICOS -->
    <div class="aba-conteudo" id="abaGraficos">
      <div class="filtros-container">
        <div class="filtro-item">
          <label>Filtrar por Usuário:</label>
          <select id="filtroUsuarioGraf" onchange="atualizarGraficos()">
            <option value="">Todos</option>
          </select>
        </div>
      </div>
      <div class="graficos-container">
        <div class="grafico-box">
          <div class="titulo-grafico">Atendimentos por Dia</div>
          <canvas id="graficoBarras"></canvas>
        </div>
        <div class="grafico-box">
          <div class="titulo-grafico">Distribuição de Atendimentos</div>
          <canvas id="graficoCircular"></canvas>
        </div>
      </div>
    </div>

    <!-- ABA: HISTÓRICO SEMANAL -->
    <div class="aba-conteudo" id="abaHistoricoSemanal">
      <div class="filtros-container">
        <div class="filtro-item">
          <label>Selecionar Semana:</label>
          <select id="filtroSemana" onchange="atualizarHistoricoSemanal()">
            <option value="">Carregando...</option>
          </select>
        </div>
      </div>
      <div class="historico-semana-container" id="conteudoHistoricoSemanal">
        <div style="text-align: center; color: #aaa;">Carregando dados...</div>
      </div>
    </div>

    <!-- ABA: HISTÓRICO MENSAL -->
    <div class="aba-conteudo" id="abaHistoricoMensal">
      <div class="filtros-container">
        <div class="filtro-item">
          <label>Selecionar Mês:</label>
          <select id="filtroMes" onchange="atualizarHistoricoMensal()">
            <option value="">Carregando...</option>
          </select>
        </div>
      </div>
      <div class="historico-semana-container" id="conteudoHistoricoMensal">
        <div style="text-align: center; color: #aaa;">Carregando dados...</div>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebaseapp/9.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebaseapp/9.10.0/firebase-database.js"></script>

  <script>
    // CONFIGURAÇÃO
    const senhaChefe = "chefe2025";
    const usuariosChefes = ["alpinto", "mdsantos", "vtcosta", "gmesserschmidt"];
    let usuarioLogado = null;
    let atendimentosData = {};

    const firebaseConfig = {
      apiKey: "AIzaSyAsuP9gO2sBOmzBet2b7ijljMgTsXo29lE",
      authDomain: "painel-senhas-hcpa.firebaseapp.com",
      databaseURL: "https://painel-senhas-hcpa-default-rtdb.firebaseio.com",
      projectId: "painel-senhas-hcpa",
      storageBucket: "painel-senhas-hcpa.firebasestorage.app",
      messagingSenderId: "164117661743",
      appId: "1:164117661743:web:c82a42d485af05ecd71eda",
      measurementId: "G-92XCSNDE54"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function checarLogin() {
      const usuario = document.getElementById("usuario").value.trim();
      const senha = document.getElementById("senha").value;
      const msg = document.getElementById("msgSenha");

      if (usuariosChefes.includes(usuario) && senha === senhaChefe) {
        usuarioLogado = usuario;
        document.getElementById("login-protect").style.display = "none";
        document.getElementById("painel-container").style.display = "block";
        msg.textContent = "";
        carregarDados();
        return;
      }

      msg.textContent = "Usuário ou senha incorretos!";
    }

    function logout() {
      usuarioLogado = null;
      document.getElementById("login-protect").style.display = "flex";
      document.getElementById("painel-container").style.display = "none";
      document.getElementById("usuario").value = "";
      document.getElementById("senha").value = "";
      document.getElementById("msgSenha").textContent = "";
    }

    function carregarDados() {
      db.ref("atendimentos").on("value", snap => {
        atendimentosData = snap.val() || {};
        atualizarResumo();
        atualizarTempoReal();
        atualizarGraficos();
        carregarSemanas();
        carregarMeses();
      });
    }

    function mudarAba(aba) {
      document.querySelectorAll(".aba-conteudo").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".aba-btn").forEach(el => el.classList.remove("active"));

      const abaId = "aba" + aba.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');
      const abaElement = document.getElementById(abaId);
      if (abaElement) {
        abaElement.classList.add("active");
      }

      event.target.classList.add("active");

      if (aba === "resumo") atualizarResumo();
      if (aba === "tempo-real") atualizarTempoReal();
      if (aba === "graficos") atualizarGraficos();
      if (aba === "historico-semanal") {
        carregarSemanas();
        atualizarHistoricoSemanal();
      }
      if (aba === "historico-mensal") {
        carregarMeses();
        atualizarHistoricoMensal();
      }
    }

    function definirTurno(timestamp) {
      const hora = new Date(timestamp).getHours();
      return hora < 12 ? "MANHÃ" : "TARDE";
    }

    function formatTempo(segundos) {
      if (segundos < 60) return segundos + "s";
      const min = Math.floor(segundos / 60);
      const seg = segundos % 60;
      return min + "m " + seg + "s";
    }

    function atualizarResumo() {
      const agora = new Date();
      const hojeStr = agora.toISOString().slice(0, 10);
      const tbody = document.getElementById("tabelaResumo");
      tbody.innerHTML = "";

      const usuariosStats = {};

      for (let usuario in atendimentosData) {
        const atendimentosObj = atendimentosData[usuario];
        const atendimentos = Object.values(atendimentosObj).filter(a => a && typeof a === 'object');
        const hoje = atendimentos.filter(a => {
          const dataAtend = new Date(a.timestamp).toISOString().slice(0, 10);
          return dataAtend === hojeStr;
        });

        if (hoje.length === 0) continue;

        hoje.sort((a, b) => a.timestamp - b.timestamp);

        const manha = hoje.filter(a => definirTurno(a.timestamp) === "MANHÃ");
        const tarde = hoje.filter(a => definirTurno(a.timestamp) === "TARDE");

        let tempos = [];
        for (let i = 1; i < hoje.length; i++) {
          tempos.push(hoje[i].timestamp - hoje[i - 1].timestamp);
        }

        const tempoMedio = tempos.length ? formatTempo(Math.round(tempos.reduce((a, b) => a + b) / tempos.length / 1000)) : "--";

        usuariosStats[usuario] = {
          qtManha: manha.length,
          qtTarde: tarde.length,
          qtTotal: hoje.length,
          ultimo: new Date(hoje[hoje.length - 1].timestamp).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
          tempoMedio,
          atendimentos: hoje
        };
      }

      const usuarios = Object.keys(usuariosStats).sort((a, b) => usuariosStats[b].qtTotal - usuariosStats[a].qtTotal);

      if (usuarios.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="msg-vazio">Nenhum atendimento hoje</td></tr>';
        return;
      }

      usuarios.forEach(usuario => {
        const stats = usuariosStats[usuario];
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${usuario}</td>
          <td class="numero">${stats.qtManha}</td>
          <td class="numero">${stats.qtTarde}</td>
          <td class="numero"><strong>${stats.qtTotal}</strong></td>
          <td>${stats.ultimo}</td>
          <td>${stats.tempoMedio}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function atualizarTempoReal() {
      const agora = new Date();
      const hojeStr = agora.toISOString().slice(0, 10);

      let totalHoje = 0, qtManha = 0, qtTarde = 0;

      for (let usuario in atendimentosData) {
        const atendimentosObj = atendimentosData[usuario];
        const atendimentos = Object.values(atendimentosObj).filter(a => a && typeof a === 'object');
        const hoje = atendimentos.filter(a => {
          const dataAtend = new Date(a.timestamp).toISOString().slice(0, 10);
          return dataAtend === hojeStr;
        });

        hoje.forEach(a => {
          totalHoje++;
          if (definirTurno(a.timestamp) === "MANHÃ") qtManha++;
          else qtTarde++;
        });
      }

      document.getElementById("qtTotalHoje").textContent = totalHoje;
      document.getElementById("qtManhaHoje").textContent = qtManha;
      document.getElementById("qtTardeHoje").textContent = qtTarde;
    }

    function atualizarGraficos() {
      const filtroUsuario = document.getElementById("filtroUsuarioGraf")?.value || "";
      const ultimosDias = 7;
      const agora = new Date();
      const diasData = {};

      for (let i = 0; i < ultimosDias; i++) {
        const data = new Date(agora);
        data.setDate(data.getDate() - i);
        const dataStr = data.toISOString().slice(0, 10);
        diasData[dataStr] = { label: data.toLocaleDateString("pt-BR", { weekday: 'short' }).toUpperCase() + " " + dataStr, total: 0, manha: 0, tarde: 0 };
      }

      for (let usuario in atendimentosData) {
        if (filtroUsuario && usuario !== filtroUsuario) continue;

        const atendimentosObj = atendimentosData[usuario];
        const atendimentos = Object.values(atendimentosObj).filter(a => a && typeof a === 'object');

        atendimentos.forEach(a => {
          const dataStr = new Date(a.timestamp).toISOString().slice(0, 10);
          if (diasData[dataStr]) {
            diasData[dataStr].total++;
            if (definirTurno(a.timestamp) === "MANHÃ") diasData[dataStr].manha++;
            else diasData[dataStr].tarde++;
          }
        });
      }

      const dias = Object.keys(diasData).reverse();
      const labels = dias.map(d => diasData[d].label);
      const totais = dias.map(d => diasData[d].total);

      if (window.graficoBarras) window.graficoBarras.destroy();
      const ctxBarras = document.getElementById("graficoBarras").getContext("2d");
      window.graficoBarras = new Chart(ctxBarras, {
        type: "bar",
        data: {
          labels: labels,
          datasets: [{
            label: "Atendimentos",
            data: totais,
            backgroundColor: "#276e5b",
            borderColor: "#ffe900",
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: "#fff" } } },
          scales: { y: { ticks: { color: "#fff" }, grid: { color: "#444" } }, x: { ticks: { color: "#fff" }, grid: { color: "#444" } } }
        }
      });

      let manhaTotal = 0, tardeTotal = 0;
      dias.forEach(d => { manhaTotal += diasData[d].manha; tardeTotal += diasData[d].tarde; });

      if (window.graficoCircular) window.graficoCircular.destroy();
      const ctxCircular = document.getElementById("graficoCircular").getContext("2d");
      window.graficoCircular = new Chart(ctxCircular, {
        type: "doughnut",
        data: {
          labels: ["Manhã", "Tarde"],
          datasets: [{
            data: [manhaTotal, tardeTotal],
            backgroundColor: ["#ff9800", "#0074d9"],
            borderColor: ["#fff", "#fff"],
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: "#fff" } } }
        }
      });

      const filtro = document.getElementById("filtroUsuarioGraf");
      if (filtro) {
        filtro.innerHTML = '<option value="">Todos</option>';
        Object.keys(atendimentosData).forEach(u => {
          filtro.innerHTML += `<option value="${u}">${u}</option>`;
        });
      }
    }

    function carregarSemanas() {
      const select = document.getElementById("filtroSemana");
      const agora = new Date();
      const mesAtual = agora.getMonth();
      const anoAtual = agora.getFullYear();

      select.innerHTML = "";

      const primeiro = new Date(anoAtual, mesAtual, 1);
      const ultimo = new Date(anoAtual, mesAtual + 1, 0);

      let semanaCount = 1;
      let dataIni = new Date(primeiro);

      while (dataIni <= ultimo) {
        const dataFim = new Date(dataIni);
        dataFim.setDate(dataFim.getDate() + 6);

        if (dataFim > ultimo) dataFim.setDate(ultimo.getDate());

        const dataIniStr = dataIni.toLocaleDateString("pt-BR");
        const dataFimStr = dataFim.toLocaleDateString("pt-BR");
        const value = `${semanaCount}|${dataIni.getTime()}|${dataFim.getTime()}`;

        select.innerHTML += `<option value="${value}">Semana ${semanaCount} (${dataIniStr} a ${dataFimStr})</option>`;

        dataIni.setDate(dataIni.getDate() + 7);
        semanaCount++;
      }

      if (select.options.length > 0) {
        select.selectedIndex = 0;
      }
    }

    function atualizarHistoricoSemanal() {
      const select = document.getElementById("filtroSemana");
      const valor = select.value;

      if (!valor) {
        document.getElementById("conteudoHistoricoSemanal").innerHTML = '<div style="text-align: center; color: #aaa;">Selecione uma semana</div>';
        return;
      }

      const [semanaNum, dataIniMs, dataFimMs] = valor.split('|');
      const dataIni = new Date(parseInt(dataIniMs));
      const dataFim = new Date(parseInt(dataFimMs));

      const diasSemana = {};
      for (let d = new Date(dataIni); d <= dataFim; d.setDate(d.getDate() + 1)) {
        const dataStr = d.toISOString().slice(0, 10);
        diasSemana[dataStr] = { agendar: 0, agendados: 0, preferencial: 0 };
      }

      for (let usuario in atendimentosData) {
        const atendimentosObj = atendimentosData[usuario];
        const atendimentos = Object.values(atendimentosObj).filter(a => a && typeof a === 'object');

        atendimentos.forEach(a => {
          const dataStr = new Date(a.timestamp).toISOString().slice(0, 10);
          if (diasSemana[dataStr]) {
            const tipo = (a.tipo || "").toLowerCase();
            if (tipo.includes("agendar")) diasSemana[dataStr].agendar++;
            else if (tipo.includes("agendad")) diasSemana[dataStr].agendados++;
            else if (tipo.includes("preferencial")) diasSemana[dataStr].preferencial++;
          }
        });
      }

      let html = '<div class="historico-dias">';
      const nomesDias = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];

      for (let d = new Date(dataIni); d <= dataFim; d.setDate(d.getDate() + 1)) {
        const dataStr = d.toISOString().slice(0, 10);
        const diaSemana = nomesDias[d.getDay()];
        const dados = diasSemana[dataStr] || { agendar: 0, agendados: 0, preferencial: 0 };
        const total = dados.agendar + dados.agendados + dados.preferencial;

        html += `
          <div class="dia-item">
            <div class="dia-titulo">${diaSemana} - ${d.toLocaleDateString("pt-BR")}</div>
            <div class="barra-horizontal">
              ${dados.agendar > 0 ? `<div class="barra-segmento agendar" style="width: ${(dados.agendar / total * 100)}%" title="Agendar: ${dados.agendar}">Agendar: ${dados.agendar}</div>` : ''}
              ${dados.agendados > 0 ? `<div class="barra-segmento agendados" style="width: ${(dados.agendados / total * 100)}%" title="Agendados: ${dados.agendados}">Agendados: ${dados.agendados}</div>` : ''}
              ${dados.preferencial > 0 ? `<div class="barra-segmento preferencial" style="width: ${(dados.preferencial / total * 100)}%" title="Preferencial: ${dados.preferencial}">Preferencial: ${dados.preferencial}</div>` : ''}
            </div>
            <div class="total-dia">Total: ${total}</div>
          </div>
        `;
      }

      html += `
        <div class="legenda-historico">
          <div class="legenda-item">
            <div class="legenda-cor agendar"></div>
            <div class="legenda-texto">Agendar (Vermelho)</div>
          </div>
          <div class="legenda-item">
            <div class="legenda-cor agendados"></div>
            <div class="legenda-texto">Agendados (Azul)</div>
          </div>
          <div class="legenda-item">
            <div class="legenda-cor preferencial"></div>
            <div class="legenda-texto">Preferencial (Amarelo)</div>
          </div>
        </div>
      `;

      html += '</div>';
      document.getElementById("conteudoHistoricoSemanal").innerHTML = html;
    }

    function carregarMeses() {
      const select = document.getElementById("filtroMes");
      const agora = new Date();
      const anoAtual = agora.getFullYear();

      select.innerHTML = "";

      const meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

      for (let m = 0; m < 12; m++) {
        const valor = `${m}|${anoAtual}`;
        select.innerHTML += `<option value="${valor}">${meses[m]} de ${anoAtual}</option>`;
      }

      const mesAtual = agora.getMonth();
      select.value = `${mesAtual}|${anoAtual}`;
    }

    function atualizarHistoricoMensal() {
      const select = document.getElementById("filtroMes");
      const valor = select.value;

      if (!valor) {
        document.getElementById("conteudoHistoricoMensal").innerHTML = '<div style="text-align: center; color: #aaa;">Carregando dados...</div>';
        return;
      }

      const [mes, ano] = valor.split('|');
      const mesNum = parseInt(mes);
      const anoNum = parseInt(ano);

      const primeiro = new Date(anoNum, mesNum, 1);
      const ultimo = new Date(anoNum, mesNum + 1, 0);

      const diasMes = {};
      for (let d = new Date(primeiro); d <= ultimo; d.setDate(d.getDate() + 1)) {
        const dataStr = d.toISOString().slice(0, 10);
        diasMes[dataStr] = { agendar: 0, agendados: 0, preferencial: 0 };
      }

      for (let usuario in atendimentosData) {
        const atendimentosObj = atendimentosData[usuario];
        const atendimentos = Object.values(atendimentosObj).filter(a => a && typeof a === 'object');

        atendimentos.forEach(a => {
          const dataStr = new Date(a.timestamp).toISOString().slice(0, 10);
          if (diasMes[dataStr]) {
            const tipo = (a.tipo || "").toLowerCase();
            if (tipo.includes("agendar")) diasMes[dataStr].agendar++;
            else if (tipo.includes("agendad")) diasMes[dataStr].agendados++;
            else if (tipo.includes("preferencial")) diasMes[dataStr].preferencial++;
          }
        });
      }

      const meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
      let html = `<div class="mes-header">${meses[mesNum]} de ${anoNum}</div>`;

      const nomesDias = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sab"];
      let semanaCount = 1;

      for (let d = new Date(primeiro); d <= ultimo; d.setDate(d.getDate() + 1)) {
        if (d.getDay() === 0 && d.getDate() !== 1) {
          semanaCount++;
          html += `<div class="semana-header">Semana ${semanaCount}</div>`;
        }

        if (d.getDate() === 1) {
          html += `<div class="semana-header">Semana ${semanaCount}</div>`;
        }

        const dataStr = d.toISOString().slice(0, 10);
        const dados = diasMes[dataStr] || { agendar: 0, agendados: 0, preferencial: 0 };
        const total = dados.agendar + dados.agendados + dados.preferencial;

        html += `
          <div class="dia-item">
            <div class="dia-titulo">${nomesDias[d.getDay()]} - ${d.getDate()}</div>
        `;

        if (total === 0) {
          html += `<div style="color: #aaa; padding: 10px;">Nenhum atendimento</div>`;
        } else {
          html += `
            <div class="barra-horizontal">
              ${dados.agendar > 0 ? `<div class="barra-segmento agendar" style="width: ${(dados.agendar / total * 100)}%">Agendar: ${dados.agendar}</div>` : ''}
              ${dados.agendados > 0 ? `<div class="barra-segmento agendados" style="width: ${(dados.agendados / total * 100)}%">Agendados: ${dados.agendados}</div>` : ''}
              ${dados.preferencial > 0 ? `<div class="barra-segmento preferencial" style="width: ${(dados.preferencial / total * 100)}%">Preferencial: ${dados.preferencial}</div>` : ''}
            </div>
            <div class="total-dia">Total: ${total}</div>
          `;
        }

        html += `</div>`;
      }

      html += `
        <div class="legenda-historico">
          <div class="legenda-item">
            <div class="legenda-cor agendar"></div>
            <div class="legenda-texto">Agendar (Vermelho)</div>
          </div>
          <div class="legenda-item">
            <div class="legenda-cor agendados"></div>
            <div class="legenda-texto">Agendados (Azul)</div>
          </div>
          <div class="legenda-item">
            <div class="legenda-cor preferencial"></div>
            <div class="legenda-texto">Preferencial (Amarelo)</div>
          </div>
        </div>
      `;

      document.getElementById("conteudoHistoricoMensal").innerHTML = html;
    }
